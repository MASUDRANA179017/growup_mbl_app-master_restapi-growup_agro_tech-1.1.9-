name: growup_agro
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.2+41

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.2.2  # or latest
  image_picker: ^1.0.4
  intl: ^0.20.2
  url_launcher: ^6.2.5
  percent_indicator: ^4.2.2
  dio: ^5.4.1
  path_provider: ^2.1.2
  permission_handler: ^12.0.1
  flutter_html: ^3.0.0
  shurjopay: ^2.0.8
  flutter_sslcommerz: ^3.0.1
  flutter_secure_storage: ^9.0.0 # check for latest version
  package_info_plus: ^8.3.0
  webview_flutter: ^4.2.1
  font_awesome_flutter: ^10.10.0
  carousel_slider: ^5.1.1
  share_plus: ^12.0.0
  in_app_update: ^4.2.5
  flutter_svg: ^2.0.17
  video_player: ^2.10.0
  open_filex: ^4.7.0
  flutter_file_dialog: ^3.0.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_pdfview: ^1.3.2
  chewie: ^1.7.5
  cupertino_icons: ^1.0.8

  #new packages
  get: ^4.7.3
  get_cli: ^1.9.1
  shimmer: ^3.0.0
  connectivity_plus: ^7.0.0
  ts_logger: ^1.1.2
  google_fonts: ^6.3.3
  advance_notification: ^1.0.6
  flutter_easyloading: ^3.0.5
  get_storage: ^2.1.1
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo1.png"

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/img.png
    - assets/icons/img_5.png
    - assets/icons/logo1.png
    - assets/icons/edit.png
    - assets/images/GrowUPlogin.jpg
    - assets/images/intropage.jpg
    - assets/images/register.jpg
    - assets/icons/Shariah.png
    - assets/icons/Secure.png
    - assets/images/GrowupLogo.png
    - assets/screen.jpeg
    - assets/images/placeholder1.jpg
    - assets/images/img_2.png
    - assets/images/img_1.png
    - assets/images/futurefram.jpg
    - assets/images/certificate.png
    - assets/images/animal.jpg
    - assets/images/fram.jpg
    - assets/images/agriessn.jpg
    - assets/images/APP-BG1-Recovered.jpg
    - assets/videos/intro.mov
    - assets/
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/videos/

  fonts:
    - family: FontMain
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf

    - family: Fontappbar
      fonts:
        - asset: assets/fonts/OpenSans-Italic.ttf